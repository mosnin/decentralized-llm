name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Rust / Anchor programs ─────────────────────────────────────────────────
  rust-check:
    name: Rust check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78.0"
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo check (validates Rust without BPF toolchain)
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  anchor-build:
    name: Anchor build & test
    runs-on: ubuntu-latest
    continue-on-error: true   # BPF toolchain heavy — non-blocking
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78.0"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI + platform tools
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-1.18.0-platformtools-${{ runner.os }}-v5

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.solana.com/v1.18.0/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install BPF platform tools
        run: |
          BPF_SDK="$HOME/.local/share/solana/install/active_release/bin/sdk/sbf"
          DEPS_DIR="$BPF_SDK/dependencies"
          if [ -d "$DEPS_DIR/platform-tools" ]; then
            echo "Platform tools already present (cached)."
          else
            # Detect the required version from the SDK version file if available,
            # otherwise fall back to the known version for Solana 1.18.0
            VERSION=$(cat "$BPF_SDK/version.yml" 2>/dev/null \
              | grep -oP '(?<=platform_tools_version: )v[0-9]+\.[0-9]+' \
              || echo "v1.41")
            echo "Downloading platform-tools $VERSION ..."
            mkdir -p "$DEPS_DIR"
            curl -fSL \
              "https://github.com/anza-xyz/platform-tools/releases/download/$VERSION/platform-tools-linux-x86_64.tar.bz2" \
              -o /tmp/platform-tools.tar.bz2
            tar -xjf /tmp/platform-tools.tar.bz2 -C "$DEPS_DIR"
            echo "Platform tools installed."
          fi

      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Install Node deps
        run: npm install
        continue-on-error: true

      - name: Anchor build
        run: anchor build

      - name: Anchor test (localnet)
        run: anchor test --skip-local-validator
        continue-on-error: true

  # ── Python ────────────────────────────────────────────────────────────────
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (node + client + integrations)
        run: |
          mypy node/ client/ integrations/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (no GPU)
        run: |
          pip install pytest pytest-asyncio pytest-mock
          pip install cryptography
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate peft
          pip install fastapi httpx aiohttp
          pip install lighthouseweb3

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"
