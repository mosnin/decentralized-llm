name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Rust / Anchor programs ─────────────────────────────────────────────────
  anchor-build:
    name: Anchor build & test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78.0"
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI + platform tools
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-1.18.0-platformtools-${{ runner.os }}-v3

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.0/install)"

      - name: Set Solana PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Pre-warm BPF platform tools
        run: |
          # cargo build-sbf downloads platform-tools on first run; do it explicitly
          # so the cache captures them for subsequent runs
          cargo build-sbf --version 2>/dev/null || \
            "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" --version || true

      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Install Node deps
        run: npm install

      - name: Rustfmt check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Anchor build
        run: anchor build

      - name: Anchor test (localnet)
        run: anchor test --skip-local-validator
        continue-on-error: true

  # ── Python ────────────────────────────────────────────────────────────────
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (node + client + integrations)
        run: |
          mypy node/ client/ integrations/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # strict mode enabled incrementally

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (no GPU)
        run: |
          pip install pytest pytest-asyncio pytest-mock
          # Cryptography for ECIES prompt encryption tests
          pip install cryptography
          # CPU-only torch (avoids 2GB GPU download in CI)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate peft
          pip install fastapi httpx aiohttp
          # Lighthouse storage SDK
          pip install lighthouseweb3

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"  # warn only until baseline is set
