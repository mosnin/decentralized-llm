version: "3.9"

# Production-ready stack — multi-stage GPU node images + API gateway.
# Compatible with Vast.ai, RunPod, and io.net GPU rental platforms.
#
# Usage:
#   cp .env.example .env        # fill in SOLANA_RPC_URL, LIGHTHOUSE_API_KEY, etc.
#   docker compose up --build
#
# For single-GPU deployment set NUM_SHARDS=1.
# For GPU rental platforms pass --build-arg CUDA_VERSION=<version> to match the host driver.

x-node-common: &node-common
  build:
    context: .
    dockerfile: docker/Dockerfile.node
    # Override CUDA version to match the rental platform driver:
    #   docker compose build --build-arg CUDA_VERSION=12.2.0
    args:
      CUDA_VERSION: ${CUDA_VERSION:-12.4.0}
  environment:
    # Solana cluster endpoint (devnet, mainnet-beta, or self-hosted validator)
    SOLANA_RPC_URL:       ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
    # Lighthouse IPFS/Filecoin storage key — get one at files.lighthouse.storage
    LIGHTHOUSE_API_KEY:   ${LIGHTHOUSE_API_KEY:-}
    # Solana wallet JSON keyfile mounted at /wallet/id.json
    WALLET_PATH:          /wallet/id.json
    # HuggingFace model identifier to load
    MODEL_NAME:           ${MODEL_NAME:-meta-llama/Llama-3.2-1B}
    # Total number of shards across all nodes
    NUM_SHARDS:           "2"
    # Torch dtype: float16 (GPU) or float32 (CPU)
    MODEL_DTYPE:          ${MODEL_DTYPE:-float16}
    # Maximum simultaneous inference jobs per node
    MAX_CONCURRENT_JOBS:  "2"
    # Public-facing host used for DHT peer discovery
    PUBLIC_HOST:          ${PUBLIC_HOST:-}
  volumes:
    - model-cache:/root/.cache/decentralized-llm
    - ${WALLET_PATH:-~/.config/solana/id.json}:/wallet/id.json:ro
  restart: unless-stopped

services:
  # ── Shard 0: embedding + first half of transformer layers ─────────────────
  node-0:
    <<: *node-common
    container_name: dllm-node-0
    environment:
      SOLANA_RPC_URL:       ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      LIGHTHOUSE_API_KEY:   ${LIGHTHOUSE_API_KEY:-}
      WALLET_PATH:          /wallet/id.json
      MODEL_NAME:           ${MODEL_NAME:-meta-llama/Llama-3.2-1B}
      NUM_SHARDS:           "2"
      MODEL_DTYPE:          ${MODEL_DTYPE:-float16}
      MAX_CONCURRENT_JOBS:  "2"
      SHARD_INDEX:          "0"
      LISTEN_PORT:          "7070"
      # Public hostname or IP this node advertises to peers
      PUBLIC_HOST:          ${PUBLIC_HOST:-node-0}
      # Comma-separated list of DHT bootstrap peer multiaddrs (empty = first peer)
      DHT_BOOTSTRAP_PEERS:  ""
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - dllm-net
    # Uncomment to use a real GPU (required for non-CPU models):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Shard 1: second half of layers + LM head ─────────────────────────────
  node-1:
    <<: *node-common
    container_name: dllm-node-1
    environment:
      SOLANA_RPC_URL:       ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      LIGHTHOUSE_API_KEY:   ${LIGHTHOUSE_API_KEY:-}
      WALLET_PATH:          /wallet/id.json
      MODEL_NAME:           ${MODEL_NAME:-meta-llama/Llama-3.2-1B}
      NUM_SHARDS:           "2"
      MODEL_DTYPE:          ${MODEL_DTYPE:-float16}
      MAX_CONCURRENT_JOBS:  "2"
      SHARD_INDEX:          "1"
      LISTEN_PORT:          "7071"
      PUBLIC_HOST:          ${PUBLIC_HOST:-node-1}
      # Bootstrap via node-0's DHT address
      DHT_BOOTSTRAP_PEERS:  "/ip4/node-0/tcp/7070"
    ports:
      - "7071:7071"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7071/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      node-0:
        condition: service_healthy
    networks:
      - dllm-net

  # ── REST API gateway (OpenAI-compatible) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dllm-api
    environment:
      # Solana cluster endpoint
      SOLANA_RPC_URL:         ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # Lighthouse storage API key
      LIGHTHOUSE_API_KEY:     ${LIGHTHOUSE_API_KEY:-}
      # Paysh payment processing API key
      PAYSH_API_KEY:          ${PAYSH_API_KEY:-}
      # Paysh webhook HMAC secret for validating callbacks
      PAYSH_WEBHOOK_SECRET:   ${PAYSH_WEBHOOK_SECRET:-}
      WALLET_PATH:            /wallet/id.json
      # PUBLIC_HOST for the API gateway's own advertised address
      PUBLIC_HOST:            ${PUBLIC_HOST:-}
    volumes:
      - ${WALLET_PATH:-~/.config/solana/id.json}:/wallet/id.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      node-0:
        condition: service_healthy
      node-1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dllm-net

volumes:
  model-cache:

networks:
  dllm-net:
    driver: bridge
