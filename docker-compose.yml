version: "3.9"

# Development stack — CPU-only, 2 shards, no GPU required.
# For production GPU deployment use: python scripts/deploy_network.py
#
# Usage:
#   cp .env.example .env        # add SOLANA_RPC_URL, LIGHTHOUSE_API_KEY, etc.
#   docker compose up --build
#
# Solana: point SOLANA_RPC_URL at devnet or run a local validator separately.

x-node-common: &node-common
  build:
    context: .
    dockerfile: docker/Dockerfile.node
  environment:
    SOLANA_RPC_URL:       ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
    LIGHTHOUSE_API_KEY:   ${LIGHTHOUSE_API_KEY:-}
    WALLET_PATH:          /wallet/id.json
    MODEL_NAME:           ${MODEL_NAME:-meta-llama/Llama-3.2-1B}
    NUM_SHARDS:           "2"
    MODEL_DTYPE:          ${MODEL_DTYPE:-float32}
    MAX_CONCURRENT_JOBS:  "2"
  volumes:
    - model-cache:/root/.cache/decentralized-llm
    - ${WALLET_PATH:-~/.config/solana/id.json}:/wallet/id.json:ro
  restart: unless-stopped

services:
  # ── Shard 0: embedding + first half of transformer layers ─────────────────
  node-0:
    <<: *node-common
    container_name: dllm-node-0
    environment:
      SHARD_INDEX:          "0"
      LISTEN_PORT:          "70070"
      PUBLIC_HOST:          "node-0"
      DHT_BOOTSTRAP_PEERS:  ""
    ports:
      - "70070:70070"
    networks:
      - dllm-net
    # Uncomment to use a real GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Shard 1: second half of layers + LM head ─────────────────────────────
  node-1:
    <<: *node-common
    container_name: dllm-node-1
    environment:
      SHARD_INDEX:          "1"
      LISTEN_PORT:          "70071"
      PUBLIC_HOST:          "node-1"
      DHT_BOOTSTRAP_PEERS:  "/ip4/node-0/tcp/70070"
    ports:
      - "70071:70071"
    depends_on:
      - node-0
    networks:
      - dllm-net

  # ── REST API gateway (OpenAI-compatible) ──────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dllm-gateway
    environment:
      SOLANA_RPC_URL:         ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      LIGHTHOUSE_API_KEY:     ${LIGHTHOUSE_API_KEY:-}
      PAYSH_API_KEY:          ${PAYSH_API_KEY:-}
      PAYSH_WEBHOOK_SECRET:   ${PAYSH_WEBHOOK_SECRET:-}
      WALLET_PATH:            /wallet/id.json
    volumes:
      - ${WALLET_PATH:-~/.config/solana/id.json}:/wallet/id.json:ro
    ports:
      - "8000:8000"
    depends_on:
      - node-0
      - node-1
    networks:
      - dllm-net

volumes:
  model-cache:

networks:
  dllm-net:
    driver: bridge
