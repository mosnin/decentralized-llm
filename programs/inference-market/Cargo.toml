[package]
name = "inference-market"
version = "0.1.0"
description = "Decentralized inference job marketplace on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "inference_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
